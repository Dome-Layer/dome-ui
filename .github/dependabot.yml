# DA-007: dependency CVE scanning + freshness. Dependabot watches the full
# dependency set (prod + dev) and opens grouped weekly PRs; CI's npm audit
# gates the shipped surface. github-actions keeps workflow pins fresh.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        versions: [">= 6.0"]
      - dependency-name: "eslint"
        versions: [">= 10.0"]
      - dependency-name: "vite"
        versions: [">= 8.0"]
      - dependency-name: "react"
        versions: [">= 19.0"]
      - dependency-name: "react-dom"
        versions: [">= 19.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
