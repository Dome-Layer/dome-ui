name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - name: Security audit (npm audit)
        # DA-007: gate on production deps only; dev-tool advisories are tracked by
        # Dependabot, not gated here, so they can't block CI.
        run: npm audit --omit=dev --audit-level=high
